name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Nightly test against DOLFINx main
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python lint
        run: |
          pip3 install ruff
          ruff check --preview .

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dolfinx: ["v0.11.0", "nightly"]
    # Breakage against DOLFINx main should not block merging
    continue-on-error: ${{ matrix.dolfinx == 'nightly' }}
    container: dolfinx/dolfinx:${{ matrix.dolfinx }}
    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    steps:
      - uses: actions/checkout@v4

      # Build against the nanobind and scikit-build-core installed in the
      # container so the nanobind ABI matches DOLFINx's Python interface
      - name: Build
        run: |
          pip3 install -v --no-build-isolation --no-deps \
            --config-settings=cmake.define.LEOPART_WERROR=ON .

      - name: Test (serial)
        working-directory: test
        run: python3 -m pytest -v .

      - name: Test (2 ranks)
        working-directory: test
        run: mpirun -np 2 python3 -m pytest -v .

      - name: Test (3 ranks)
        working-directory: test
        run: mpirun -np 3 python3 -m pytest -v .

      - name: Run demos
        if: matrix.dolfinx == 'v0.11.0'
        working-directory: demo
        run: |
          python3 demo_advection-l2-projection.py
          mpirun -np 2 python3 demo_particle-io.py
